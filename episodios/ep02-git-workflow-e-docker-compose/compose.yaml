services:
  api:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: ${PORT:-3000}
      DATABASE_URL: postgres://${POSTGRES_USER:-ltmv}:${POSTGRES_PASSWORD:-ltmv_dev_only}@db:5432/${POSTGRES_DB:-ltmv_orders}

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ltmv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ltmv_dev_only}
      POSTGRES_DB: ${POSTGRES_DB:-ltmv_orders}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-ltmv} -d $${POSTGRES_DB:-ltmv_orders}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
